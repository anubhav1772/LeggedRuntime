robot: unitree_g1

model_path: assets/robots/unitree_g1/scene_white.xml
policy_path: checkpoints/g1/flat/policy.onnx

simulation:
  dt: 0.005
  decimation: 4

initial_state:
  base_pos: [0.0, 0.0, 0.80]
  base_quat: [1.0, 0.0, 0.0, 0.0]

policy:
  obs_dim: 1060
  action_dim: 29
  history_length: 10
  single_obs_dim: 106
  action_scale: 0.25
  clip_actions: 100.0
  clip_observations: 100.0

actuators:
  armature: 0.01

