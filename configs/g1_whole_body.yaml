robot: unitree_g1

bodies:
  base: pelvis
  torso: torso_link

model_path: assets/robots/unitree_g1/scene_white.xml
policy_path: checkpoints/g1/flat/policy.onnx
metadata_path: checkpoints/g1/flat/deployment_info.json

simulation:
  dt: 0.005
  decimation: 4

initial_state:
  base_pos: [0.0, 0.0, 0.80]
  base_quat: [1.0, 0.0, 0.0, 0.0]

policy:
  type: whole_body
  source: Ego-VCP

  obs_dim: 1060
  action_dim: 29
  history_length: 10
  single_obs_dim: 106

  action_scale: 0.25
  clip_actions: 100.0
  clip_observations: 100.0

actuators:
  armature: 0.01

  # Joint name: [default_position, kp, kd, effort_limit]
  joints:
    left_hip_pitch_joint:       [-0.20, 200, 5, 88]
    left_hip_roll_joint:        [ 0.00, 150, 5, 139]
    left_hip_yaw_joint:         [ 0.00, 150, 5, 88]
    left_knee_joint:            [ 0.42, 200, 5, 139]
    left_ankle_pitch_joint:     [-0.23,  20, 2, 35]
    left_ankle_roll_joint:      [ 0.00,  20, 2, 35]

    right_hip_pitch_joint:      [-0.20, 200, 5, 88]
    right_hip_roll_joint:       [ 0.00, 150, 5, 139]
    right_hip_yaw_joint:        [ 0.00, 150, 5, 88]
    right_knee_joint:           [ 0.42, 200, 5, 139]
    right_ankle_pitch_joint:    [-0.23,  20, 2, 35]
    right_ankle_roll_joint:     [ 0.00,  20, 2, 35]

    waist_yaw_joint:           [ 0.00, 200, 5, 88]
    waist_roll_joint:          [ 0.00, 200, 5, 35]
    waist_pitch_joint:         [ 0.00, 200, 5, 35]

    left_shoulder_pitch_joint: [ 0.35, 100, 2, 25]
    left_shoulder_roll_joint:  [ 0.18, 100, 2, 25]
    left_shoulder_yaw_joint:   [ 0.00,  50, 2, 25]
    left_elbow_joint:          [ 0.87,  50, 2, 25]
    left_wrist_roll_joint:     [ 0.00,  40, 2, 25]
    left_wrist_pitch_joint:    [ 0.00,  40, 2, 5]
    left_wrist_yaw_joint:      [ 0.00,  40, 2, 5]

    right_shoulder_pitch_joint: [ 0.35, 100, 2, 25]
    right_shoulder_roll_joint:  [-0.18, 100, 2, 25]
    right_shoulder_yaw_joint:   [ 0.00,  50, 2, 25]
    right_elbow_joint:          [ 0.87,  50, 2, 25]
    right_wrist_roll_joint:     [ 0.00,  40, 2, 25]
    right_wrist_pitch_joint:    [ 0.00,  40, 2, 5]
    right_wrist_yaw_joint:      [ 0.00,  40, 2, 5]

observations:
  joint_names:
    - left_hip_pitch_joint
    - right_hip_pitch_joint
    - waist_yaw_joint
    - left_hip_roll_joint
    - right_hip_roll_joint
    - waist_roll_joint
    - left_hip_yaw_joint
    - right_hip_yaw_joint
    - waist_pitch_joint
    - left_knee_joint
    - right_knee_joint
    - left_shoulder_pitch_joint
    - right_shoulder_pitch_joint
    - left_ankle_pitch_joint
    - right_ankle_pitch_joint
    - left_shoulder_roll_joint
    - right_shoulder_roll_joint
    - left_ankle_roll_joint
    - right_ankle_roll_joint
    - left_shoulder_yaw_joint
    - right_shoulder_yaw_joint
    - left_elbow_joint
    - right_elbow_joint
    - left_wrist_roll_joint
    - right_wrist_roll_joint
    - left_wrist_pitch_joint
    - right_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_wrist_yaw_joint

  scales:
    ang_vel: 1.0
    projected_gravity: 1.0
    commands: 1.0
    joint_pos: 1.0
    joint_vel: 1.0
    actions: 1.0

commands:
  velocity: [0.0, 0.0, 0.0]

  # Left hand xyz, right hand xyz, roll, pitch, yaw, height
  whole_body: [0.20, 0.25, 0.15, 0.20, -0.25, 0.15, 0.0, 0.0, 0.0, 0.80]

evaluation:
  warmup_s: 2.0

  fall_detection:
    enabled: true
    min_base_height: 0.45
    max_base_tilt_deg: 60.0

  metrics:
    velocity_tracking: true
    base_stability: true
    torso_height_tracking: true
    inference_latency: true
    real_time_factor: true
